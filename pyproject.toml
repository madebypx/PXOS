[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pxos"
version = "2.4.0"
description = "The minimal, document-driven operating system and governance layer for AI-assisted software engineering."
readme = "README.md"
authors = [{ name = "PROJECT/X", email = "hello@madebypx.com" }]
license = { text = "Apache-2.0" }
keywords = [
    "ai",
    "llm",
    "agents",
    "framework",
    "operating-system",
    "governance",
    "multi-agent",
    "cursor",
    "claude",
    "gemini"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://pxos.madebypx.com"
Repository = "https://github.com/madebypx/PXOS"
Documentation = "https://github.com/madebypx/PXOS#readme"
"LLM Reference" = "https://raw.githubusercontent.com/madebypx/PXOS/main/llms.txt"

[project.scripts]
pxos = "pxos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pxos*"]

[tool.setuptools.package-data]
pxos = ["templates/**/*", "scripts/**/*"]
