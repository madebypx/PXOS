<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PXOS — Universal 5-State UI Inspector</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --danger: #f43f5e;
      --danger-hover: #e11d48;
      --danger-glow: rgba(244, 63, 94, 0.25);
      --success: #10b981;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* State Switcher Bar */
    .state-toolbar {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 28px;
      overflow-x: auto;
      backdrop-filter: blur(12px);
    }

    .state-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-align: center;
    }

    .state-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }

    .state-btn.active {
      background: var(--primary);
      color: #041324;
      font-weight: 600;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    /* Stage Card */
    .stage {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
      min-height: 320px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* State 1: Initial Idle */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 16px 20px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .item-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .item-info h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .item-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: #041324;
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.12);
      color: var(--danger);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--danger-glow);
    }

    .btn-neutral {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn-neutral:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* State 2: Loading Pending (Skeletons) */
    .skeleton-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .skeleton-item {
      height: 64px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* State 3: Empty Data */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 16px;
      opacity: 0.8;
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 380px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }

    /* State 4: Error Recovery */
    .error-card {
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
    }

    .error-icon {
      font-size: 36px;
      color: var(--danger);
      margin-bottom: 12px;
    }

    .error-card h3 {
      font-size: 17px;
      color: #fecdd3;
      margin-bottom: 8px;
    }

    .error-card p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* State 5: Destructive Action Guard */
    .guard-dialog {
      background: rgba(30, 16, 24, 0.95);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: var(--radius);
      padding: 28px;
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
      box-shadow: 0 12px 36px rgba(244, 63, 94, 0.15);
    }

    .guard-badge {
      display: inline-block;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 999px;
      background: rgba(244, 63, 94, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
      margin-bottom: 12px;
    }

    .guard-dialog h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .guard-dialog p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .guard-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    /* State description footnote */
    .state-info {
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      border: 1px solid var(--card-border);
    }

    .state-info code {
      color: var(--primary);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">PXOS UI / T-12 Reference</span>
      <h1>Universal 5-State Inspector</h1>
      <p class="subtitle">Interactive reference ensuring zero UI blind spots across all interactive states</p>
    </header>

    <!-- State Switcher Toolbar -->
    <nav class="state-toolbar" role="tablist" aria-label="Universal UI States">
      <button class="state-btn active" role="tab" aria-selected="true" onclick="switchState('initial_idle')">1. Initial Idle</button>
      <button class="state-btn" role="tab" aria-selected="false" onclick="switchState('loading_pending')">2. Loading Pending</button>
      <button class="state-btn" role="tab" aria-selected="false" onclick="switchState('empty_data')">3. Empty Data</button>
      <button class="state-btn" role="tab" aria-selected="false" onclick="switchState('error_recovery')">4. Error Recovery</button>
      <button class="state-btn" role="tab" aria-selected="false" onclick="switchState('destructive_action_guard')">5. Destructive Guard</button>
    </nav>

    <!-- Interactive Component Stage -->
    <main class="stage" id="stage">
      <!-- Dynamic State Injected Here -->
    </main>

    <footer class="state-info" id="state-info">
      <span>Active State: <code id="active-state-label">initial_idle</code></span>
      <span>Nielsen UX Heuristic: Status Visibility & Error Prevention</span>
    </footer>
  </div>

  <script>
    const mockItems = [
      { id: "PX-101", title: "Telemetry Ingestion Daemon", status: "Active", updated: "2m ago" },
      { id: "PX-102", title: "Invariant Evolution Engine", status: "Active", updated: "14m ago" },
      { id: "PX-103", title: "Universal 5-State Inspector", status: "In Spec", updated: "Just now" }
    ];

    const stateDescriptions = {
      initial_idle: "Clean populated list view adhering to design tokens and responsive layout.",
      loading_pending: "Accessible shimmer skeleton matching content geometry without layout shift.",
      empty_data: "Zero-state banner with helpful instructions and primary creation Call-to-Action.",
      error_recovery: "Graceful error presentation isolating failure with non-destructive Retry action.",
      destructive_action_guard: "Confirmation dialog guarding irreversible deletions with danger tokens."
    };

    function renderInitialIdle() {
      return `
        <div class="item-list">
          ${mockItems.map(item => `
            <div class="item-card">
              <div class="item-info">
                <h4>${item.title}</h4>
                <p>ID: ${item.id} • Status: ${item.status} • Updated: ${item.updated}</p>
              </div>
              <button class="btn btn-danger" onclick="switchState('destructive_action_guard')">Delete</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderLoadingPending() {
      return `
        <div class="skeleton-list" aria-busy="true" aria-live="polite">
          <div class="skeleton-item"></div>
          <div class="skeleton-item"></div>
          <div class="skeleton-item"></div>
        </div>
      `;
    }

    function renderEmptyData() {
      return `
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <h3>No Active Subsystems Found</h3>
          <p>Your workspace is clean. Initialize a new component or task specification to begin auditing.</p>
          <button class="btn btn-primary" onclick="switchState('initial_idle')">+ Initialize Component</button>
        </div>
      `;
    }

    function renderErrorRecovery() {
      return `
        <div class="error-card" role="alert">
          <div class="error-icon">⚠️</div>
          <h3>Failed to Synchronize Telemetry</h3>
          <p>HTTP 503 Service Unavailable: Remote socket connection timed out after 10000ms.</p>
          <button class="btn btn-primary" onclick="switchState('loading_pending')">↻ Retry Connection</button>
        </div>
      `;
    }

    function renderDestructiveActionGuard() {
      return `
        <div class="guard-dialog" role="dialog" aria-modal="true" aria-labelledby="guard-title">
          <span class="guard-badge">Irreversible Action</span>
          <h3 id="guard-title">Delete Task T-12 Component?</h3>
          <p>This will permanently purge this component specification, all state snapshots, and associated telemetry logs. This action cannot be undone.</p>
          <div class="guard-actions">
            <button class="btn btn-neutral" onclick="switchState('initial_idle')">Cancel</button>
            <button class="btn btn-danger" onclick="switchState('empty_data')">Yes, Delete Component</button>
          </div>
        </div>
      `;
    }

    function switchState(stateName) {
      const stage = document.getElementById('stage');
      const label = document.getElementById('active-state-label');
      
      // Update Toolbar buttons
      document.querySelectorAll('.state-btn').forEach(btn => {
        const isActive = btn.getAttribute('onclick').includes(stateName);
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });

      label.textContent = stateName;

      switch (stateName) {
        case 'loading_pending':
          stage.innerHTML = renderLoadingPending();
          break;
        case 'empty_data':
          stage.innerHTML = renderEmptyData();
          break;
        case 'error_recovery':
          stage.innerHTML = renderErrorRecovery();
          break;
        case 'destructive_action_guard':
          stage.innerHTML = renderDestructiveActionGuard();
          break;
        case 'initial_idle':
        default:
          stage.innerHTML = renderInitialIdle();
          break;
      }
    }

    // Initial render
    switchState('initial_idle');
  </script>
</body>
</html>
