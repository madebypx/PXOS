name: Benchmark Submission
description: Submit empirical session telemetry or benchmark data to the PXOS laboratory
labels: ["telemetry", "benchmarks"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to the PXOS empirical research dataset! Telemetry must be strictly anonymous and free of proprietary code or PII.
  - type: input
    id: task_id
    attributes:
      label: Task / Session ID
      placeholder: "TASK-20260904-AUTH-01"
    validations:
      required: true
  - type: dropdown
    id: complexity_tier
    attributes:
      label: Complexity Tier
      options:
        - tier_1_micro (single file, <= 50 lines changed)
        - tier_2_medium (2-5 files, 50-300 lines changed)
        - tier_3_complex (6+ files, architectural / cross-subsystem)
    validations:
      required: true
  - type: textarea
    id: metrics_json
    attributes:
      label: Sanitized Benchmark JSON
      description: Paste the JSON output generated by `/benchmark` or `scripts/pxos-benchmark.py`.
      render: json
    validations:
      required: true
